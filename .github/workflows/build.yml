name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write Config.swift from secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GOOGLE_KEY: ${{ secrets.GOOGLE_KEY }}
        run: |
          cat > Shared/Config.swift <<SWIFT
          enum Config {
              static let supabaseURL = "${SUPABASE_URL}"
              static let supabaseKey = "${SUPABASE_KEY}"
              static let googleKey = "${GOOGLE_KEY}"
              static let channel = "sard"
          }
          SWIFT

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild -project Sard.xcodeproj -scheme Sard -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Sard.app Payload/
          zip -qry Sard.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: Sard-ipa
          path: Sard.ipa
